name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6 # v6.0.3

      - name: Set up mise
        uses: jdx/mise-action@v4 # v4.1.0

      - name: Run checks
        run: mise run check

      - name: Verify install
        run: mise run verify-install

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        example: [users_api, threaded, introspect, byo_server, ssr_htmx]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6 # v6.0.3

      - name: Set up mise
        uses: jdx/mise-action@v4 # v4.1.0

      - name: Build and test the standalone example
        run: |
          zig build test
          zig build

  zio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/ssr_htmx
    steps:
      - name: Checkout
        uses: actions/checkout@v6 # v6.0.3
      - name: Set up mise
        uses: jdx/mise-action@v4 # v4.1.0
      - name: Test both runtime variants
        run: zig build test -Dzio=true
      - name: Build both runtime executables
        run: zig build -Dzio=true
