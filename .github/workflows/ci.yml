name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6 # v6.0.3

      - name: Set up mise
        uses: jdx/mise-action@v4 # v4.1.0

      - name: Run checks
        run: mise run check

      - name: Verify install
        run: mise run verify-install

  ssr-htmx:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/ssr_htmx
    steps:
      - name: Checkout
        uses: actions/checkout@v6 # v6.0.3

      - name: Set up mise
        uses: jdx/mise-action@v4 # v4.1.0

      - name: Build and test the standalone HTML example
        run: |
          zig build test
          zig build

      - name: Verify HTTP behavior
        run: |
          ./zig-out/bin/ssr-htmx &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:8080/api/catalog >/dev/null; then
              break
            fi
            sleep 0.1
          done
          python3 test_http.py
