[tools]
zig = "0.16.0"

[tasks.fmt]
description = "Format library and standalone example sources"
run = [
  "zig fmt build.zig src tests",
  "zig fmt --zon build.zig.zon tests/consumer/build.zig.zon",
  "for example in examples/*; do zig fmt \"$example/build.zig\" \"$example/src\"; zig fmt --zon \"$example/build.zig.zon\"; done",
]

[tasks.fmt-check]
description = "Check library and standalone example formatting"
run = [
  "zig fmt --check --ast-check build.zig src tests",
  "zig fmt --check --zon build.zig.zon tests/consumer/build.zig.zon",
  "for example in examples/*; do zig fmt --check --ast-check \"$example/build.zig\" \"$example/src\"; zig fmt --check --zon \"$example/build.zig.zon\"; done",
]

[tasks.test]
description = "Run library tests and every standalone example's Zig tests"
run = [
  "zig build test",
  "for example in examples/*; do (cd \"$example\" && zig build test) || exit; done",
]

[tasks.verify-install]
description = "Build a consumer that depends on zchema alone"
run = "cd tests/consumer && zig build"

[tasks.check]
description = "Check formatting, tests, and consumer installation"
depends = ["fmt-check", "test", "verify-install"]

[tasks.ssr]
description = "Run the SSR and HTMX catalog on localhost:8080"
dir = "examples/ssr_htmx"
run = "zig build run"

[tasks.test-zio]
description = "Run SSR HTTP and cancellation tests under both runtimes"
dir = "examples/ssr_htmx"
run = "zig build test -Dzio=true"

[tasks.ssr-zio]
description = "Run the catalog with the optional pinned Zio runtime"
dir = "examples/ssr_htmx"
run = "zig build run-zio -Dzio=true"

[tasks.benchmark]
description = "Build ReleaseFast variants and run repeated loopback comparisons"
dir = "examples/ssr_htmx"
run = ["zig build benchmark -Dzio=true -Doptimize=ReleaseFast", "bash benchmark.sh"]
